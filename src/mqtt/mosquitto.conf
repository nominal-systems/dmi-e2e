# Mosquitto config for the e2e harness broker. dmi-api and the provider integrations speak MQTT to
# this broker; the DMI shared-subscription mechanism (SharedMessagePattern/SharedEventPattern ->
# `$share/<group>/<topic>`) needs MQTT 5.0 shared subscriptions, which mosquitto 2.x supports and
# ActiveMQ 5.x "classic" (the previous broker) does not. Anonymous access, all interfaces — this is a
# throwaway test broker on a private compose network, never exposed.
listener 1883 0.0.0.0
allow_anonymous true
