name: e2e-zoetis

# Full-system zoetis suite (HARNESS_FULL_STACK=1, HARNESS_STACK=zoetis): dmi-api + mosquitto + redis +
# the Zoetis mock (built from this repo) + the REAL dmi-engine-zoetis-integration container. It boots
# ~7 containers and builds the integration image, so it is scoped exactly like e2e-idexx.yml and
# e2e-antech.yml:
#
#   - push to main   ALWAYS. Cheap insurance that main never silently breaks, and push events carry
#                    secrets so there is no fork problem.
#   - pull_request   Only when the harness, the Zoetis mock, compose or the zoetis scenario actually
#                    changes — a docs tweak or an antech-only edit shouldn't pay for it. This is why
#                    each loop gets its own workflow rather than another job in e2e.yml.
#   - dispatch       On demand.
#
# It lives in its own workflow rather than in e2e.yml because `paths:` filters are per-workflow, not
# per-job: filtering inside e2e.yml would also gate the fast `harness` job, which must run on every
# PR. No credentials or real Zoetis endpoints are involved — the harness runs entirely against the
# mock, whose data is synthetic, and the mock builds even the URLs the integration POSTs back to
# (the order-status `link href`s) from the request's own Host header.
#
# Note this suite is slower than the idexx one, for the same reason the antech one is: the zoetis
# integration hardcodes both its Bull poll intervals to 30s with no env knob (unlike idexx's
# IDEXX_*_POLLING_INTERVAL_MS), so the loop waits whole intervals rather than the ~3s the idexx run
# is dialled down to.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      # The harness plumbing, the Zoetis mock and the broker config all live under src/.
      - 'src/**'
      - 'scenarios/zoetis-full-stack.e2e.ts'
      - 'docker-compose.yml'
      - 'jest.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-zoetis.yml'
  workflow_dispatch:
  # Nightly drift detector. This workflow's pull_request trigger fires only on changes to dmi-e2e's
  # own files, but the integration and dmi-api are checked out at `main` and move independently — an
  # upstream change can turn this loop red with no PR here to catch it (exactly how the idexx
  # device-rule change sat undetected until an unrelated push). The nightly reruns the whole loop
  # against current main of all three, so drift surfaces within a day. Fires only from the default
  # branch, and only once this file is on main.
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC; off the hour, where GitHub's scheduler is least backed up

concurrency:
  group: e2e-zoetis-${{ github.ref }}
  cancel-in-progress: true

# packages:read lets the workflow's GITHUB_TOKEN pull @nominal-systems/dmi-engine-common (that
# package grants this repo Actions read).
permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '20.x'
  DMI_API_REF: main

jobs:
  zoetis-full-stack:
    name: Zoetis full-stack harness
    runs-on: ubuntu-latest
    # A PR from a fork cannot read the org secrets this job needs (the dmi-ci app private key), so skip
    # it cleanly instead of showing a confusing red X — dmi-e2e is public. Note the `event_name` clause:
    # `github.event.pull_request` is null on push/dispatch, so a bare same-repo comparison would skip
    # those runs too.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout dmi-e2e
        uses: actions/checkout@v5
        with:
          path: dmi-e2e

      # The default GITHUB_TOKEN is scoped to this repo only and cannot read the private dmi-api /
      # integration repos. The org's `dmi-ci` GitHub App (contents:read on those repos) mints a
      # short-lived token per run.
      - name: Mint checkout token (dmi-api + zoetis integration)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DMI_CI_APP_ID }}
          private-key: ${{ secrets.DMI_CI_APP_PRIVATE_KEY }}
          owner: nominal-systems
          repositories: |
            dmi-api
            dmi-engine-zoetis-integration

      - name: Checkout dmi-api
        uses: actions/checkout@v5
        with:
          repository: nominal-systems/dmi-api
          ref: ${{ env.DMI_API_REF }}
          token: ${{ steps.app-token.outputs.token }}
          path: dmi-api

      - name: Checkout dmi-engine-zoetis-integration
        uses: actions/checkout@v5
        with:
          repository: nominal-systems/dmi-engine-zoetis-integration
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: dmi-engine-zoetis-integration

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dmi-e2e/package-lock.json
            dmi-api/package-lock.json

      - name: Install harness dependencies
        working-directory: dmi-e2e
        run: npm install --no-audit --no-fund

      - name: Install dmi-api dependencies
        working-directory: dmi-api
        run: npm install --no-audit --no-fund
        env:
          GHP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck harness
        working-directory: dmi-e2e
        run: npm run typecheck

      # The zoetis integration image resolves @nominal-systems/dmi-engine-common from GitHub Packages at
      # build time. GHP_TOKEN is the workflow's own GITHUB_TOKEN, not the app token: that package grants
      # this repo Actions read (which is how the fast job installs it), whereas an app token can only
      # read packages of repos inside its installation — and dmi-engine-common is not one of them. The
      # app token is only needed for the private *checkouts* above. The mock image needs no token.
      - name: Run the zoetis full-stack harness
        working-directory: dmi-e2e
        run: npm run test:harness
        env:
          HARNESS_FULL_STACK: '1'
          HARNESS_STACK: zoetis
          DMI_API_DIR: ${{ github.workspace }}/dmi-api
          DMI_ZOETIS_INTEGRATION_DIR: ${{ github.workspace }}/dmi-engine-zoetis-integration
          GHP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the log dump below is guaranteed to print nothing: the harness's
          # globalTeardown runs `docker compose down -v` on its way out whether the run passed or
          # failed, so by the time an `if: failure()` step runs there are no containers left. That
          # matters most exactly when it hurts most — this loop's characteristic failure is a silent
          # completion timeout, and a failing zoetis poll logs nothing outside the container, so the
          # container logs are the only diagnostic there is. KEEP_UP defers teardown to the explicit
          # step below.
          HARNESS_KEEP_UP: '1'

      - name: Dump container logs on failure
        if: failure()
        working-directory: dmi-e2e
        run: docker compose --profile zoetis logs --no-color --tail=200

      # Paired with HARNESS_KEEP_UP above: the harness no longer tears itself down, so do it here.
      # `always()` so a failed run cleans up too (the runner is ephemeral, but leaving the volumes
      # behind would poison a self-hosted one).
      - name: Tear down the stack
        if: always()
        working-directory: dmi-e2e
        run: docker compose --profile zoetis down -v
