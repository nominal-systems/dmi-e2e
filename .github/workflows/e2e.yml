name: e2e

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # Nightly: the fast suite runs dmi-api (checked out at main) against real MySQL/Mongo/ActiveMQ and
  # regression-tests its migrations and the tenant-isolation guards — dmi-api moves on its own, so
  # this surfaces a main that broke without a dmi-e2e PR to trigger it. Each full-system loop has a
  # nightly of its own, in its own workflow.
  schedule:
    - cron: '17 3 * * *'  # 03:17 UTC; off the hour, where GitHub's scheduler is least backed up

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN needs packages:read to install @nominal-systems/dmi-engine-common; the package
# grants this repo Actions read access (its package settings → "Manage Actions access").
permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '20.x'
  # dmi-api is a separate private repo. CI checks it out and runs it in-process, the same way the
  # harness does locally. An alternative — pulling the published image from the ACR that
  # dmi-api's build-and-push-to-registry.yml targets — is cleaner (tests the shipped artifact) but
  # needs registry-pull credentials as secrets; revisit once those exist. See README / plan log.
  DMI_API_REF: main

jobs:
  harness:
    name: Integration harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dmi-e2e
        uses: actions/checkout@v5
        with:
          path: dmi-e2e

      # The default GITHUB_TOKEN is scoped to this repo only and cannot read dmi-api. The org's
      # `dmi-ci` GitHub App (contents:read on dmi-api alone) mints a short-lived token per run.
      - name: Mint dmi-api checkout token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DMI_CI_APP_ID }}
          private-key: ${{ secrets.DMI_CI_APP_PRIVATE_KEY }}
          owner: nominal-systems
          repositories: dmi-api

      - name: Checkout dmi-api
        uses: actions/checkout@v5
        with:
          repository: nominal-systems/dmi-api
          ref: ${{ env.DMI_API_REF }}
          token: ${{ steps.app-token.outputs.token }}
          path: dmi-api

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dmi-e2e/package-lock.json
            dmi-api/package-lock.json

      - name: Install harness dependencies
        working-directory: dmi-e2e
        run: npm ci --no-audit --no-fund

      # dmi-api's .npmrc reads ${GHP_TOKEN} to resolve @nominal-systems/dmi-engine-common from
      # GitHub Packages; in CI the workflow's own GITHUB_TOKEN fills that role.
      # `npm ci` here too: dmi-api's lockfile is what is under test. If this step fails, dmi-api's
      # package-lock.json is out of sync with its package.json — surface that upstream rather than
      # switching back to `npm install`, which would quietly test a different dependency tree.
      - name: Install dmi-api dependencies
        working-directory: dmi-api
        run: npm ci --no-audit --no-fund
        env:
          GHP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck harness
        working-directory: dmi-e2e
        run: npm run typecheck

      - name: Run the harness
        working-directory: dmi-e2e
        run: npm run test:harness
        env:
          DMI_API_DIR: ${{ github.workspace }}/dmi-api

      - name: Dump container logs on failure
        if: failure()
        working-directory: dmi-e2e
        run: docker compose logs --no-color --tail=200

  # Each full-system loop lives in its own workflow (.github/workflows/e2e-<key>.yml, one per key of
  # the stack registry in src/stacks.js, which refuses a loop without one): it needs a `paths:` filter
  # on pull_request, and those filters are per-workflow — applying one here would also gate the fast
  # `harness` job above, which must run on every PR.
