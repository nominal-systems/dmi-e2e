name: e2e

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_full_stack:
        description: 'Attempt the demo full-stack harness job (blocked upstream; see full-stack job)'
        type: boolean
        default: false
      run_idexx_full_stack:
        description: 'Run the idexx full-stack harness job (needs dmi-ci on dmi-engine-idexx-integration)'
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN needs packages:read to install @nominal-systems/dmi-engine-common; the package
# grants this repo Actions read access (its package settings → "Manage Actions access").
permissions:
  contents: read
  packages: read

env:
  NODE_VERSION: '20.x'
  # dmi-api is a separate private repo. CI checks it out and runs it in-process, the same way the
  # harness does locally. An alternative — pulling the published image from the ACR that
  # dmi-api's build-and-push-to-registry.yml targets — is cleaner (tests the shipped artifact) but
  # needs registry-pull credentials as secrets; revisit once those exist. See README / plan log.
  DMI_API_REF: main

jobs:
  harness:
    name: Integration harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dmi-e2e
        uses: actions/checkout@v5
        with:
          path: dmi-e2e

      # The default GITHUB_TOKEN is scoped to this repo only and cannot read dmi-api. The org's
      # `dmi-ci` GitHub App (contents:read on dmi-api alone) mints a short-lived token per run.
      - name: Mint dmi-api checkout token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DMI_CI_APP_ID }}
          private-key: ${{ secrets.DMI_CI_APP_PRIVATE_KEY }}
          owner: nominal-systems
          repositories: dmi-api

      - name: Checkout dmi-api
        uses: actions/checkout@v5
        with:
          repository: nominal-systems/dmi-api
          ref: ${{ env.DMI_API_REF }}
          token: ${{ steps.app-token.outputs.token }}
          path: dmi-api

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dmi-e2e/package-lock.json
            dmi-api/package-lock.json

      - name: Install harness dependencies
        working-directory: dmi-e2e
        run: npm install --no-audit --no-fund

      # dmi-api's .npmrc reads ${GHP_TOKEN} to resolve @nominal-systems/dmi-engine-common from
      # GitHub Packages; in CI the workflow's own GITHUB_TOKEN fills that role.
      - name: Install dmi-api dependencies
        working-directory: dmi-api
        run: npm install --no-audit --no-fund
        env:
          GHP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck harness
        working-directory: dmi-e2e
        run: npm run typecheck

      - name: Run the harness
        working-directory: dmi-e2e
        run: npm run test:harness
        env:
          DMI_API_DIR: ${{ github.workspace }}/dmi-api

      - name: Dump container logs on failure
        if: failure()
        working-directory: dmi-e2e
        run: docker compose logs --no-color --tail=200

  # Full-system suite (HARNESS_FULL_STACK=1): dmi-api + redis + demo-provider-api + demo integration.
  # Intentionally DISABLED. Phase 0's demo scenario is blocked upstream (the demo integration on
  # `main` is not compatible with the current dmi-api, so the order->result->report loop cannot
  # close). There is nothing for this job to run green yet, so it does not check out or build the demo
  # repos, and the `dmi-ci` app is not provisioned on them. It runs only on a manual dispatch with
  # run_full_stack=true, and only prints the checklist to enable it.
  full-stack:
    name: Full-stack harness (disabled — blocked upstream)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_stack }}
    steps:
      - name: Explain why this job is disabled, and how to enable it
        run: |
          echo "Full-stack CI is disabled: the Phase 0 demo scenario is blocked upstream."
          echo "The demo integration must first be made compatible with the current dmi-api."
          echo "Enabling this job is a follow-up bundled with that upstream fix:"
          echo "  1) Install the dmi-ci GitHub App on nominal-systems/dmi-demo-provider-api and"
          echo "     nominal-systems/dmi-engine-demo-provider-integration, with Packages: read."
          echo "  2) Add both repos to the create-github-app-token 'repositories:' list."
          echo "  3) Check out both repos, then 'docker compose --profile full-stack build' with"
          echo "     GHP_TOKEN from the app token (GitHub Packages read), as the fast job does for dmi-api."
          echo "  4) Run 'npm run test:harness' with HARNESS_FULL_STACK=1 HARNESS_STACK=demo and DMI_API_DIR set."
          echo "  5) Un-skip the completion suite in scenarios/full-stack-smoke.e2e.ts and delete the"
          echo "     CONFIRMED test."

  # Idexx full-stack suite (HARNESS_FULL_STACK=1, default HARNESS_STACK=idexx): dmi-api + redis + the
  # VetConnect Plus mock (built from this repo) + the REAL dmi-engine-idexx-integration container.
  # Unlike the demo loop this one CLOSES end to end. `dmi-ci` is provisioned on
  # nominal-systems/dmi-engine-idexx-integration, so the checkout below works. It is still manual-dispatch
  # only (run_idexx_full_stack=true) and never runs on PR/push: it boots ~7 containers and builds the
  # integration image, so whether to promote it to a per-PR gate is a cost/runtime call for the team —
  # until then it cannot slow or break the required fast `harness` check. No credentials or real IDEXX
  # endpoints are involved — the harness runs entirely against the mock.
  idexx-full-stack:
    name: Idexx full-stack harness (manual dispatch)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_idexx_full_stack }}
    steps:
      - name: Checkout dmi-e2e
        uses: actions/checkout@v5
        with:
          path: dmi-e2e

      # Mints a token that can check out BOTH private repos. Requires the dmi-ci app to be installed on
      # dmi-engine-idexx-integration with contents:read + Packages:read; if it is not, this step fails
      # with a clear "repository not accessible" error — that is the one-time org-admin action to enable
      # this job.
      - name: Mint checkout token (dmi-api + idexx integration)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DMI_CI_APP_ID }}
          private-key: ${{ secrets.DMI_CI_APP_PRIVATE_KEY }}
          owner: nominal-systems
          repositories: |
            dmi-api
            dmi-engine-idexx-integration

      - name: Checkout dmi-api
        uses: actions/checkout@v5
        with:
          repository: nominal-systems/dmi-api
          ref: ${{ env.DMI_API_REF }}
          token: ${{ steps.app-token.outputs.token }}
          path: dmi-api

      - name: Checkout dmi-engine-idexx-integration
        uses: actions/checkout@v5
        with:
          repository: nominal-systems/dmi-engine-idexx-integration
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: dmi-engine-idexx-integration

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dmi-e2e/package-lock.json
            dmi-api/package-lock.json

      - name: Install harness dependencies
        working-directory: dmi-e2e
        run: npm install --no-audit --no-fund

      - name: Install dmi-api dependencies
        working-directory: dmi-api
        run: npm install --no-audit --no-fund
        env:
          GHP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck harness
        working-directory: dmi-e2e
        run: npm run typecheck

      # The idexx integration image resolves @nominal-systems/dmi-engine-common from GitHub Packages at
      # build time. GHP_TOKEN is the workflow's own GITHUB_TOKEN, not the app token: that package grants
      # this repo Actions read (which is how the fast job installs it), whereas an app token can only
      # read packages of repos inside its installation — and dmi-engine-common is not one of them. The
      # app token is only needed for the private *checkouts* above. The mock image needs no token.
      - name: Run the idexx full-stack harness
        working-directory: dmi-e2e
        run: npm run test:harness
        env:
          HARNESS_FULL_STACK: '1'
          HARNESS_STACK: idexx
          DMI_API_DIR: ${{ github.workspace }}/dmi-api
          DMI_IDEXX_INTEGRATION_DIR: ${{ github.workspace }}/dmi-engine-idexx-integration
          GHP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump container logs on failure
        if: failure()
        working-directory: dmi-e2e
        run: docker compose --profile idexx logs --no-color --tail=200
