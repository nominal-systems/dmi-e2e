# dmi-e2e — latest harness run reports: one page per suite plus an index.
#
# Static files published by the harness (HARNESS_PUBLISH_REPORT=1 on teardown, or
# `npm run report:publish`) into the directory below. The nginx worker must be able to read it — it
# typically runs as `nobody`, which cannot read into a home directory, so the harness copies the
# report out of the repo rather than serving reports/ in place.
#
# Drop this block inside the `server {}` that fronts the machine's services. On the shared mac mini
# that is /opt/homebrew/etc/nginx/servers/funnel.conf, whose enclosing server already applies HTTP
# Basic Auth; reload with `sudo /opt/homebrew/opt/nginx/bin/nginx -s reload`.
location /dmi-e2e/ {
    alias /opt/homebrew/var/www/dmi-e2e/;
    index index.html;
    add_header Cache-Control "no-cache";
}
location = /dmi-e2e {
    return 301 /dmi-e2e/;
}
