# Dependency stack for the e2e harness: the databases and broker that dmi-api needs.
#
# Deliberately not a copy of dmi-api's own docker-compose.yml. That file declares
# `env_file: .env` (and its .env.example does not define the MYSQL_ROOT_PASSWORD /
# MYSQL_DATABASE the mysql:8 image needs), and it bind-mounts ./docker/mysql/data, which
# `docker compose down -v` does not remove — so it cannot give the harness a cold start.
# Named volumes below can be wiped with `down -v`.
#
# Host ports are shifted off the defaults so a developer's dmi-api dev stack can keep running
# alongside the harness. Override with HARNESS_*_PORT.
#
# The base services (mysql, mongo, activemq) are what dmi-api alone needs and always start. The
# full-system suite (HARNESS_FULL_STACK=1) additionally starts one provider loop, selected by
# HARNESS_STACK and mapped to a compose profile:
#   - `idexx` (default): redis (Bull queues), the VetConnect Plus mock (built from this repo's
#     src/idexx-mock, zero deps), and the REAL dmi-engine-idexx-integration container.
#   - `antech`: redis, the Antech mock (built from this repo's src/antech-mock, zero deps), and the
#     REAL dmi-engine-antech-integration container (the classic antech provider, id `antech`).
#   - `full-stack`: redis, the demo vendor API + its own MySQL, and the demo provider integration
#     (the pre-existing, upstream-blocked loop).
# The integration images build from sibling checkouts and need a GHP_TOKEN build-arg to resolve
# @nominal-systems/* from GitHub Packages; the mock needs no token.

name: dmi-e2e

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${HARNESS_MYSQL_PASSWORD:-harness}
      MYSQL_DATABASE: ${HARNESS_MYSQL_DATABASE:-dmi_harness}
    ports:
      - '${HARNESS_MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql

  mongo:
    image: mongo:4
    ports:
      - '${HARNESS_MONGO_PORT:-27018}:27017'
    volumes:
      - mongo-data:/data/db

  # MQTT broker. eclipse-mosquitto 2.x (MQTT 5.0) rather than ActiveMQ 5.x "classic": the DMI
  # shared-subscription mechanism (dmi-engine-common's SharedMessagePattern/SharedEventPattern ->
  # `$share/<group>/<topic>`) needs MQTT 5.0 shared subscriptions to route the engine RPCs and the
  # inbound result/event streams, and ActiveMQ classic (which speaks only MQTT 3.1.1) silently drops
  # them — a `$share/...` subscriber never receives messages published to the base topic. The service
  # name stays `activemq` so dmi-api's ACTIVEMQ_* env and the integrations' MQTT_HOST resolve
  # unchanged. Anonymous, all interfaces — a throwaway broker on a private compose network.
  activemq:
    build:
      context: ./src/mqtt
      dockerfile_inline: |
        FROM eclipse-mosquitto:2
        COPY mosquitto.conf /mosquitto/config/
    ports:
      - '${HARNESS_ACTIVEMQ_PORT:-1884}:1883'

  # ---- full-stack profile: the demo provider loop (order -> engine -> vendor -> report) ----

  # Bull repeatable-job store for the integration's order/result polling. No harness-facing use.
  # Shared by every full-system loop (demo, idexx and antech).
  redis:
    image: redis:7-alpine
    profiles: ['full-stack', 'idexx', 'antech']
    ports:
      - '${HARNESS_REDIS_PORT:-6380}:6379'

  # The demo vendor's own database. DATABASE_SYNCHRONIZE=true lets the vendor auto-create its schema
  # on boot, so there is no migration step for it.
  demo-provider-mysql:
    image: mysql:8
    profiles: ['full-stack']
    environment:
      MYSQL_ROOT_PASSWORD: ${HARNESS_DEMO_MYSQL_PASSWORD:-demo}
      MYSQL_DATABASE: ${HARNESS_DEMO_MYSQL_DATABASE:-demo_provider}
    ports:
      - '${HARNESS_DEMO_MYSQL_PORT:-3308}:3306'
    volumes:
      - demo-provider-mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  # Simulated vendor (NestJS + MySQL). X-Api-Key auth minted via GET /demo/keys; orders auto-complete
  # ~6s after creation. Built from its own Node-14 Dockerfile (production stage).
  dmi-demo-provider-api:
    profiles: ['full-stack']
    build:
      context: ${DMI_DEMO_PROVIDER_DIR:-../dmi-demo-provider-api}
      target: production
      args:
        GHP_TOKEN: ${GHP_TOKEN:-}
    environment:
      PORT: '3000'
      DATABASE_TYPE: mysql
      DATABASE_HOST: demo-provider-mysql
      DATABASE_PORT: '3306'
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${HARNESS_DEMO_MYSQL_PASSWORD:-demo}
      DATABASE_DATABASE: ${HARNESS_DEMO_MYSQL_DATABASE:-demo_provider}
      DATABASE_SYNCHRONIZE: 'true'
    ports:
      - '${HARNESS_DEMO_PROVIDER_PORT:-3011}:3000'
    depends_on:
      demo-provider-mysql:
        condition: service_healthy

  # Demo provider integration (standalone NestJS microservice, one container per provider, matching
  # production). Needs only ActiveMQ (MQTT) + Redis (Bull); no database. Reaches the vendor over HTTP
  # using the base URL carried inside each MQTT message (the provider configuration's `url`).
  dmi-engine-demo-provider-integration:
    profiles: ['full-stack']
    build:
      context: ${DMI_DEMO_INTEGRATION_DIR:-../dmi-engine-demo-provider-integration}
      target: production
      args:
        GHP_TOKEN: ${GHP_TOKEN:-}
      # Builds the demo integration from its own (Node-14-era) sources. Its in-repo Dockerfile needs a
      # small adjustment to build under current tooling, so we mirror it here (the repo itself stays
      # untouched / read-only) rather than reference its Dockerfile. The image is included so the full
      # topology stands up and the gate can be exercised; the end-to-end loop is gated pending an
      # upstream fix to the demo integration (see README "Full-system mode"). Unused stages and the
      # runtime `wait-for` download are trimmed — the production CMD does not use them.
      dockerfile_inline: |
        FROM node:14-alpine AS base
        WORKDIR /app
        ARG GHP_TOKEN
        COPY package*.json .npmrc ./
        RUN apk add --no-cache --virtual build-base &&\
            npm install -g node-gyp &&\
            npm install &&\
            apk del build-base &&\
            npm un -g node-gyp &&\
            rm -rf /var/cache/apk/*
        COPY . .
        RUN chmod +x ./scripts/wait-for-all.sh && rm .npmrc
        FROM base AS build
        ENV NODE_ENV=production
        RUN npm run build && npm prune --production
        FROM node:14-alpine AS production
        WORKDIR /app
        ENV NODE_ENV=production
        COPY --from=build /app/scripts scripts
        COPY --from=build /app/dist dist
        COPY --from=build /app/node_modules node_modules
        COPY --from=build /app/package.json .
        EXPOSE 3000
        CMD ["npm", "run", "start:prod"]
    environment:
      PORT: '3000'
      MQTT_PROTOCOL: mqtt
      MQTT_HOST: activemq
      MQTT_PORT: '1883'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
      - activemq
      - redis
      - dmi-demo-provider-api

  # ---- idexx profile: the VetConnect Plus loop (order -> engine -> mock vendor -> report) ----

  # VetConnect Plus (IDEXX) mock vendor, built from this repo's zero-dependency Node server. Serves
  # both the ordering (/api/v1) and results (/api/v3) dialects plus the confirmOrder browser
  # handshake, and a /__control__ plane the scenario drives to seed results deterministically. Built
  # inline (a one-line COPY) rather than bind-mounted so the image is self-contained on any host, and
  # it needs no GHP_TOKEN. `orderingBaseUrl`/`resultBaseUrl` in the dmi-api provider config point at
  # this service's compose-network name, never at live *.vetconnectplus.com.
  vetconnect-mock:
    profiles: ['idexx']
    build:
      context: ./src/idexx-mock
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY server.js ./
        EXPOSE 3000
        CMD ["node", "server.js"]
    environment:
      PORT: '3000'
    ports:
      - '${HARNESS_VCP_MOCK_PORT:-3012}:3000'

  # The REAL idexx provider integration (standalone NestJS microservice, one container per provider,
  # matching production). Needs only ActiveMQ (MQTT) + Redis (Bull); no database. Reaches the mock
  # vendor over HTTP using the orderingBaseUrl/resultBaseUrl carried inside each MQTT message (the
  # provider configuration). Built from its own (Node-20) Dockerfile's `production` stage — unlike
  # the demo repo it needs no inline workaround. The polling intervals are dialed down from the
  # 30s default so the results loop closes quickly in the harness.
  dmi-engine-idexx-integration:
    profiles: ['idexx']
    build:
      context: ${DMI_IDEXX_INTEGRATION_DIR:-../dmi-engine-idexx-integration}
      target: production
      args:
        GHP_TOKEN: ${GHP_TOKEN:-}
    environment:
      PORT: '3000'
      MQTT_PROTOCOL: mqtt
      MQTT_HOST: activemq
      MQTT_PORT: '1883'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      IDEXX_RESULTS_POLLING_INTERVAL_MS: '${HARNESS_IDEXX_POLL_MS:-3000}'
      IDEXX_ORDERS_POLLING_INTERVAL_MS: '${HARNESS_IDEXX_POLL_MS:-3000}'
    depends_on:
      - activemq
      - redis
      - vetconnect-mock

  # ---- antech profile: the classic Antech loop (order -> engine -> mock vendor -> report) ----

  # Antech mock vendor, built from this repo's zero-dependency Node server. Serves Antech's
  # /api/v1.1 dialect (token login, order placement, the JSON status poll / acknowledge pair, the
  # results XML document and the PDF manifest) plus a /__control__ plane the scenario drives to seed
  # results deterministically. Built inline (a one-line COPY) rather than bind-mounted so the image
  # is self-contained on any host, and it needs no GHP_TOKEN. `baseUrl`/`uiBaseUrl` in the dmi-api
  # provider config point at this service's compose-network name, never at a live Antech host.
  antech-mock:
    profiles: ['antech']
    build:
      context: ./src/antech-mock
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY server.js ./
        EXPOSE 3000
        CMD ["node", "server.js"]
    environment:
      PORT: '3000'
    ports:
      - '${HARNESS_ANTECH_MOCK_PORT:-3013}:3000'

  # The REAL classic-antech provider integration (standalone NestJS microservice, one container per
  # provider, matching production). Needs only ActiveMQ (MQTT) + Redis (Bull); no database. Reaches
  # the mock vendor over HTTP using the baseUrl carried inside each MQTT message (the provider
  # configuration). Built from its own (Node-20) Dockerfile's `production` stage — like idexx, and
  # unlike the demo repo, it needs no inline workaround.
  #
  # Note there is no polling-interval env var to set here: the antech integration hardcodes both its
  # results and orders Bull intervals to 30s (src/config/configuration.ts), where idexx exposes
  # IDEXX_*_POLLING_INTERVAL_MS. That is why the antech scenario budgets a longer completion wait.
  dmi-engine-antech-integration:
    profiles: ['antech']
    build:
      context: ${DMI_ANTECH_INTEGRATION_DIR:-../dmi-engine-antech-integration}
      target: production
      args:
        GHP_TOKEN: ${GHP_TOKEN:-}
    environment:
      PORT: '3000'
      MQTT_PROTOCOL: mqtt
      MQTT_HOST: activemq
      MQTT_PORT: '1883'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
      - activemq
      - redis
      - antech-mock

volumes:
  mysql-data:
  mongo-data:
  demo-provider-mysql-data:
